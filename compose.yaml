services:
  ats-bot:
    build: .
    container_name: telegram-ats-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
